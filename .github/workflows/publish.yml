name: Publish post

on:
  # Pushing a new post file to main publishes it: IG carousel, IG Reel, YouTube Short.
  push:
    branches: [main]
    paths: ["posts/**"]
  workflow_dispatch:
    inputs:
      post:
        description: "Post file, e.g. posts/2026-10-20-amor-fati.json. Leave empty for the next one in the queue"
        required: false
        default: ""
      only:
        description: "Only these platforms (comma-separated: ig_carousel,ig_reel,youtube). Empty = all missing"
        required: false
        default: ""
      dry_run:
        description: "Dry run (show what would be posted, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          GRAPH_HOST: graph.instagram.com
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/out/{slug}
          POST_FILE: ${{ inputs.post }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || 'false' }}
        run: |
          args=(--next)
          if [ -n "$POST_FILE" ]; then args=("$POST_FILE"); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--publish); fi
          python publish.py "${args[@]}"

      - name: Record what was posted
        # Runs even when a platform failed, so the platforms that did post are never posted twice.
        if: always()
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "chore: record published post"
            git pull --rebase origin main
            git push
          fi
